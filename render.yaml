# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: brainsync-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brainsync-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: CHROMA_DB_PATH
        value: /app/chroma_db
      - key: GEMINI_API_KEY
        sync: false # entered manually in the dashboard

databases:
  - name: brainsync-db
    plan: free
    databaseName: brainsync
    user: brainsync
